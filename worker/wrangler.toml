name = "edge-sentiment"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Base URL of the off-loaded inference service that runs the INT8 ONNX model
# (onnxruntime-node). The Worker proxies /classify to it. Point this at your
# deployed inference service (e.g. a container, Fly.io, Render, or a small VM).
# For local `wrangler dev`, override it in worker/.dev.vars (gitignored):
#   INFERENCE_URL=http://localhost:8099
[vars]
INFERENCE_URL = "https://hrishikabra-edge-sentiment-inference.hf.space"

[observability]
enabled = true
