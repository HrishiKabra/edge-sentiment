name: Deploy web demo to GitHub Pages

# Builds the browser WebAssembly app (web/) and publishes it to GitHub Pages.
# The on-device inference demo is fully static — no server required.

on:
  push:
    branches: [main]
    # Only redeploy when the web app (or this workflow) changes — avoids
    # re-uploading the 64 MB model on unrelated pushes (training/, worker/, docs).
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # BASE_PATH must match the repo name for a project Pages site
      # (served at https://<user>.github.io/edge-sentiment/).
      - run: npm run build
        env:
          BASE_PATH: /edge-sentiment/
          # When set (repo Actions variable), enables the Cloudflare Edge backend
          # and points it at the deployed Worker. Empty -> Edge stays disabled.
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
